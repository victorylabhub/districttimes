# Netlify builds the site from this repository.
# main = production (districtimes.com). Any other branch = preview only.
[build]
  command = "pip install -r requirements.txt && python3 build.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.12"

# Licensed photos (e.g. Wikimedia Commons) are fetched and cached by Netlify Image CDN
# and served from our own domain.
[images]
  remote_images = ["https://upload\\.wikimedia\\.org/.*"]
